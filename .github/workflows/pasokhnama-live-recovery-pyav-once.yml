# One-shot replay after the PyAV compatibility hotfix. No changes to Didban.
name: Replay current Persian Pasokhnama after PyAV fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/pasokhnama-live-recovery-pyav-once.yml']
permissions:
  contents: write
jobs:
  replay:
    if: ${{ github.event.head_commit.message == 'Recover live Persian 18:00 with compatible PyAV once' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger corrected isolated transcriber only in the 18:00 program window
        uses: actions/github-script@v7
        with:
          script: |
            const clock = new Intl.DateTimeFormat('en-GB', {
              timeZone: 'Asia/Tehran', hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
            }).format(new Date());
            const [hour, minute] = clock.split(':').map(Number);
            if (hour !== 18 || minute >= 55) {
              core.notice('Outside current Persian 18:00 program window; no dispatch.');
              return;
            }
            await github.rest.repos.createDispatchEvent({
              ...context.repo,
              event_type: 'pasokhnama_live_start',
              client_payload: { network: 'persian', slot: '18:00' }
            });
            core.notice('Fresh Whisper + compatible PyAV dispatched; only isolated Pasokhnama run touched.');
