name: Test Bengali Dubbing Integration

on:
  pull_request:
    paths:
      - 'bengali_dubbing.py'
      - 'bengali_dubbing_export.py'
      - 'bengali_instant_dispatch.py'
      - 'upload_bengali_artifact.cjs'
      - 'tests/test_bengali_dubbing.py'
      - 'tests/test_bengali_instant.py'
      - '.github/workflows/didban-bengali-dub.yml'
      - '.github/workflows/velayat-monitor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Python syntax
        run: |
          python -m compileall -q bengali_dubbing.py bengali_dubbing_export.py velayat_monitor.py video_clips.py bengali_instant_dispatch.py tests/test_bengali_dubbing.py tests/test_bengali_instant.py
      - name: Install minimal test dependency
        run: python -m pip install 'requests>=2.31,<3'
      - name: Unit tests (no secrets, ML downloads or Bale messages)
        run: python -m unittest discover -s tests -p 'test_bengali*.py' -v
      - name: Smoke-test real in-run artifact upload (no dispatch, no Bale)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          folder = Path('/tmp/bengali-ci-upload')
          folder.mkdir(exist_ok=True)
          (folder / 'source_01.mp4').write_bytes(b'V' * 20000)
          (folder / 'manifest.json').write_text(json.dumps({
            'schema': 1, 'network': 'persian',
            'source': '@live_vtv', 'destination': '@double_vtv',
            'run_id': '123', 'count': 1, 'clip_index': 1,
            'clips': [{'filename': 'source_01.mp4', 'title_fa': 'smoke',
                       'start_sec': 0, 'end_sec': 60}]
          }))
          PY
      - name: Test native GitHub artifact upload (without dispatch or Bale)
        uses: actions/upload-artifact@v4
        with:
          name: bengali-ci-smoke-${{ github.run_id }}
          path: /tmp/bengali-ci-upload/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - name: Validate YAML syntax
        run: |
          python -m pip install 'PyYAML>=6,<7'
          python - <<'PY'
          from pathlib import Path
          import yaml
          for name in ['.github/workflows/didban-bengali-dub.yml', '.github/workflows/velayat-monitor.yml']:
              data = yaml.load(Path(name).read_text(), Loader=yaml.BaseLoader)
              assert 'jobs' in data and 'on' in data, name
              print('Valid:', name)
          PY
