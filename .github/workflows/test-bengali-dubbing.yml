name: Test Bengali Dubbing Integration

on:
  pull_request:
    paths:
      - 'bengali_dubbing.py'
      - 'bengali_dubbing_export.py'
      - 'tests/test_bengali_dubbing.py'
      - '.github/workflows/didban-bengali-dub.yml'
      - '.github/workflows/velayat-monitor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Python syntax
        run: |
          python -m compileall -q bengali_dubbing.py bengali_dubbing_export.py velayat_monitor.py video_clips.py tests/test_bengali_dubbing.py
      - name: Unit tests (no secrets, ML downloads or Bale messages)
        run: python -m unittest discover -s tests -p 'test_bengali_dubbing.py' -v
      - name: Validate YAML syntax
        run: |
          python -m pip install 'PyYAML>=6,<7'
          python - <<'PY'
          from pathlib import Path
          import yaml
          for name in ['.github/workflows/didban-bengali-dub.yml', '.github/workflows/velayat-monitor.yml']:
              data = yaml.load(Path(name).read_text(), Loader=yaml.BaseLoader)
              assert 'jobs' in data and 'on' in data, name
              print('Valid:', name)
          PY
