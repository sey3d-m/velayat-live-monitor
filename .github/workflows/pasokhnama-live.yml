name: Pasokhnama Live Persian (isolated)
run-name: "Pasokhnama live Persian ${{ github.event.client_payload.slot || inputs.slot }}"
on:
  repository_dispatch:
    types: [pasokhnama_live_start]
  workflow_dispatch:
    inputs:
      slot:
        description: 'Persian program time HH:MM Tehran'
        type: choice
        required: true
        options: ['18:00', '19:30', '21:00']

permissions:
  contents: write

concurrency:
  group: pasokhnama-live-${{ github.event.client_payload.slot || inputs.slot }}
  cancel-in-progress: true

jobs:
  live:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'repository_dispatch' &&
       github.event.client_payload.network == 'persian' &&
       github.event.client_payload.slot != '')
    runs-on: ubuntu-latest
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check isolated prerequisites
        shell: bash
        env:
          STREAM_URL: ${{ secrets.STREAM_URL }}
          PROGRAM_SLOT: ${{ github.event.client_payload.slot || inputs.slot }}
        run: |
          set -euo pipefail
          test -n "$STREAM_URL" || { echo 'Stream secret unavailable'; exit 1; }
          [[ "$PROGRAM_SLOT" =~ ^(18:00|19:30|21:00)$ ]] || { echo 'Invalid program slot'; exit 1; }
          # Hosted Actions images may omit FFmpeg; install ONLY inside this independent job.
          if ! command -v ffmpeg >/dev/null 2>&1; then
            echo 'Installing FFmpeg on the isolated Pasokhnama runner.'
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -hide_banner -version >/dev/null
      - name: Reuse local Whisper model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: pasokhnama-whisper-small-${{ runner.os }}-v1
          restore-keys: |
            faster-whisper-${{ runner.os }}-models-v2
            faster-whisper-${{ runner.os }}-
            pasokhnama-whisper-small-${{ runner.os }}-
      - name: Install free local Persian transcription engine
        run: pip install faster-whisper==1.2.1 'av==17.1.0'
      - name: Transcribe in parallel with the existing Didban workflow
        env:
          STREAM_URL: ${{ secrets.STREAM_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          PROGRAM_SLOT: ${{ github.event.client_payload.slot || inputs.slot }}
          PROGRAM_DATE: ${{ github.event.client_payload.date || '' }}
          PASOKHNAMA_WHISPER_MODEL: small
          PASOKHNAMA_MAX_MINUTES: '70'
          # Reuse Didban's EXISTING Gemini key; no new provider or paid add-on.
          # If quota is exhausted, raw ASR is NOT published on television.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PASOKHNAMA_EDIT_MODEL: 'gemini-2.5-flash'
        run: python -u pasokhnama_live_capture.py
