name: Verify Didban Extra Program Calendar

on:
  pull_request:
    paths:
      - 'extra_schedule.py'
      - 'didban_calendar_bot.py'
      - 'config/didban_calendar_bot_state.json'
      - 'tests/test_calendar_bot.py'
      - 'tests/test_extra_schedule.py'
      - 'velayat_monitor.py'
      - 'docs/extra-program-admin.html'
      - '.github/workflows/didban-extra-calendar-manage.yml'
      - '.github/workflows/didban-extra-calendar-dispatch.yml'
      - '.github/workflows/velayat-monitor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight scheduling test dependencies
        run: python -m pip install 'jdatetime>=5,<6' 'PyYAML>=6,<7' 'requests>=2.31,<3'
      - name: Verify Python syntax and recurrence tests
        run: |
          python -m compileall -q extra_schedule.py didban_calendar_bot.py velayat_monitor.py tests/test_extra_schedule.py tests/test_calendar_bot.py
          python -m unittest discover -s tests -p 'test_calendar_bot.py' -v
          python -m unittest discover -s tests -p 'test_extra_schedule.py' -v
      - name: Verify YAML syntax and original fixed slots
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path
          for name in ('.github/workflows/velayat-monitor.yml',
                       '.github/workflows/didban-extra-calendar-manage.yml',
                       '.github/workflows/didban-extra-calendar-dispatch.yml'):
              obj = yaml.load(Path(name).read_text(), Loader=yaml.BaseLoader)
              assert 'jobs' in obj and 'on' in obj, name
              print('Verified workflow:', name)
          source = Path('velayat_monitor.py').read_text()
          for original in ('"18:00": ("18:00", "19:00")',
                           '"19:30": ("19:30", "20:30")',
                           '"21:00": ("21:00", "22:00")'):
              assert original in source, original
          dispatch = Path('.github/workflows/didban-extra-calendar-dispatch.yml').read_text()
          assert "'requests>=2.31,<3'" in dispatch, 'Bale control requires requests on the runner'
          assert "didban_calendar_bot.py poll" in dispatch, 'Bale poll step missing'
          assert "workflow_dispatch:" in dispatch, 'Manual bot diagnosis trigger missing'
          assert 'structured_analysis_with_retry' in source
          assert 'send_bale_clips' in source
          PY
