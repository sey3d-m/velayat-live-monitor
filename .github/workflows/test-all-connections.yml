name: Test All Velayat Connections

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  all-connections-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test all connections
        env:
          STREAM_URL: ${{ secrets.STREAM_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SHEETS_WEBHOOK_URL: ${{ secrets.SHEETS_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          TEST_SECONDS: "60"
        run: python test_all_connections.py

      - name: Upload diagnostic outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-connections-test-${{ github.run_id }}
          path: |
            all_connections_transcript.txt
            all_connections_report.json
          if-no-files-found: ignore
          retention-days: 2
