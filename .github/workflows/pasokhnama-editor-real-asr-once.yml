# Second one-time safety probe: allow factual topic headlines from noisy ASR; publishes nothing.
name: Verify Persian headlines on actual recorded ASR
on:
  push:
    branches: [main]
    paths: ['.github/workflows/pasokhnama-editor-real-asr-once.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Rewrite two real neighboring broadcast speech segments
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PASOKHNAMA_EDIT_MODEL: gemini-3.5-flash-lite
        run: |
          python -u - <<'PY'
          import json,os,urllib.request
          from pasokhnama_live_editor import rewrite
          url="https://raw.githubusercontent.com/sey3d-m/velayat-live-monitor/b3343e4ab0ceebb93204c34c52ad4525aab63ba7/state/live.json"
          with urllib.request.urlopen(url,timeout=20) as response:
              data=json.load(response)
          clips=[item["summary"] for item in data["items"] if item.get("sequence") in (21,22)]
          assert len(clips)==2, "Historical audio-caption sample unavailable"
          import pasokhnama_live_editor as ed, re
          original=ed.validate
          def traced(source,proposal):
              print("REAL_ASR_AUDIT: publish="+str(proposal.get("publish"))+
                    " confidence="+str(proposal.get("confidence"))+
                    " title_length="+str(len(proposal.get("title","")))+
                    " summary_length="+str(len(proposal.get("summary","")))+
                    " evidence_exact="+str(str(proposal.get("evidence_excerpt","")).strip() in source)+
                    " evidence_length="+str(len(str(proposal.get("evidence_excerpt","")).strip()))+
                    " numbers_created="+str(set(re.findall(r"\d+",str(proposal.get("summary",""))))-
                                            set(re.findall(r"\d+",source))))
              return original(source,proposal)
          ed.validate=traced
          try:
              result=rewrite("\n".join(clips),os.environ["GEMINI_API_KEY"],timeout=55)
          except RuntimeError as e:
              print("REAL_ASR_SMOKE: service error: "+str(e))
              raise SystemExit(3)
          if result is None:
              print("REAL_ASR_SMOKE: uncertain noisy speech correctly withheld")
          else:
              print("REAL_ASR_SMOKE: ACCEPTED headline="+result["title"])
              print("REAL_ASR_SMOKE: summary="+result["summary"])
              print("REAL_ASR_SMOKE: verification="+result["verification_status"])
          PY
