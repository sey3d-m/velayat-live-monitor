name: Velayat Live Monitor

on:
  workflow_dispatch:
    inputs:
      slot:
        description: "Program slot"
        required: true
        type: choice
        options:
          - "18:00"
          - "19:30"
          - "21:00"

permissions:
  contents: read

concurrency:
  group: velayat-live-monitor-${{ inputs.slot }}
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Validate slot
        shell: bash
        env:
          SLOT: ${{ inputs.slot }}
        run: |
          case "$SLOT" in
            "18:00"|"19:30"|"21:00") echo "PROGRAM_SLOT=$SLOT" ;;
            *) echo "Invalid slot: $SLOT"; exit 1 ;;
          esac

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Monitor live program
        env:
          STREAM_URL: ${{ secrets.STREAM_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SHEETS_WEBHOOK_URL: ${{ secrets.SHEETS_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          PROGRAM_SLOT: ${{ inputs.slot }}
        run: python velayat_monitor.py

      - name: Upload transcript and diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: velayat-monitor-${{ github.run_id }}
          path: |
            program_transcript.txt
            program_report.json
          if-no-files-found: ignore
          retention-days: 3
