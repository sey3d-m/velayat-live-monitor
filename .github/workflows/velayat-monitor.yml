name: Velayat Live Monitor
run-name: "Didban ${{ inputs.network }} ${{ inputs.extra_program_id != '' && format('[extra:{0}:{1}]', inputs.extra_program_id, inputs.scheduled_date) || inputs.slot }}"

on:
  workflow_dispatch:
    inputs:
      network:
        description: "Network"
        required: true
        type: choice
        options:
          - persian
          - azeri
          - arabic
          - hausa
      slot:
        description: "Program slot HH:MM (Tehran time)"
        required: true
        type: string
      scheduled_date:
        description: "Scheduled Tehran date YYYY-MM-DD (normally filled by Apps Script)"
        required: false
        type: string
      extra_program_id:
        description: "Optional registered extra Persian program ID; blank for fixed slots"
        required: false
        type: string

permissions:
  contents: write

# Same-time programs on different networks run independently. Accidental duplicate
# dispatches for the same network/slot/date are serialized, never allowed to cancel
# the active recording.
concurrency:
  group: velayat-live-monitor-${{ inputs.network }}-${{ inputs.slot }}-${{ inputs.scheduled_date }}
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Validate network and slot
        shell: bash
        env:
          NETWORK: ${{ inputs.network }}
          SLOT: ${{ inputs.slot }}
          EXTRA_ID: ${{ inputs.extra_program_id }}
        run: |
          set -euo pipefail
          case "${NETWORK}:${SLOT}" in
            persian:18:00|persian:19:30|persian:21:00|azeri:16:30|azeri:18:00|arabic:21:00|hausa:22:30)
              echo "Valid schedule: ${NETWORK} ${SLOT}"
              ;;
            persian:*)
              if [[ -n "${EXTRA_ID}" && "${SLOT}" =~ ^([01][0-9]|2[0-3]):[0-5][0-9]$ ]]; then
                echo "Additional Persian program requested; authenticated calendar validation follows in Python"
              else
                echo "Invalid unregistered Persian slot: ${SLOT}" >&2
                exit 1
              fi
              ;;
            *)
              echo "Invalid network/slot pair: ${NETWORK} ${SLOT}" >&2
              exit 1
              ;;
          esac

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Identify checked-out release and clip-only destination
        env:
          NETWORK: ${{ inputs.network }}
        shell: bash
        run: |
          echo "Checked-out revision: $(git rev-parse --short HEAD)"
          python - <<'PY'
          import os
          from clip_settings import load_clip_settings
          cfg = load_clip_settings()
          network = os.environ.get("NETWORK", "persian")
          print("Clip destination:", cfg["destination"])
          print("Clips for network:", network, cfg["enabled"] and cfg["networks"].get(network, False))
          print("Clip count:", cfg["count_per_program"])
          print("Clip duration:", cfg["min_seconds"], "to", cfg["max_seconds"], "seconds")
          print("Speed:", cfg["speed"], "Quality:", cfg["quality"])
          print("Report destination: existing BALE_CHAT_ID, unchanged")
          PY

      - name: Ensure FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Cache faster-whisper model downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: faster-whisper-${{ runner.os }}-models-v2
          restore-keys: |
            faster-whisper-${{ runner.os }}-models-
            faster-whisper-${{ runner.os }}-

      - name: Install Python packages
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Monitor live program
        env:
          NETWORK: ${{ inputs.network }}
          PROGRAM_SLOT: ${{ inputs.slot }}
          SCHEDULED_DATE: ${{ inputs.scheduled_date }}
          EXTRA_PROGRAM_ID: ${{ inputs.extra_program_id }}

          # Existing Persian stream secret; no change required.
          STREAM_URL: ${{ secrets.STREAM_URL }}

          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SHEETS_WEBHOOK_URL: ${{ secrets.SHEETS_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENABLE_BN_DUB_INSTANT: 'true'

          # Persian reports remain in the existing Bale channel.
          # Azeri / Arabic / Hausa reports go to the new non-Persian channel.
          BALE_CHAT_ID: ${{ inputs.network == 'persian' && secrets.BALE_CHAT_ID || secrets.BALE_CHAT_ID_NONPERSIAN }}

          GITHUB_RUN_ID: ${{ github.run_id }}

          # Optional repository variables. Built-in defaults are used when empty.
          AZERI_STREAM_URL: ${{ vars.AZERI_STREAM_URL }}
          ARABIC_STREAM_URL: ${{ vars.ARABIC_STREAM_URL }}
          HAUSA_STREAM_URL: ${{ vars.HAUSA_STREAM_URL }}
          WHISPER_MODEL: ${{ vars.WHISPER_MODEL }}

          # Clip-only route, count, speed, and encoding are read from
          # config/didban_clips.json. Old variable speed overrides are removed.
          ENABLE_BALE_VIDEO_CLIPS: ${{ vars.ENABLE_BALE_VIDEO_CLIPS || 'true' }}
          ENABLE_VISUAL_REVIEW: ${{ vars.ENABLE_VISUAL_REVIEW || 'true' }}
          VISUAL_REVIEW_MODEL: ${{ vars.VISUAL_REVIEW_MODEL || 'gemini-3.8-flash' }}
          VISUAL_REPORT_IMAGE_COUNT: ${{ vars.VISUAL_REPORT_IMAGE_COUNT || '2' }}
        run: python velayat_monitor.py

      # Official action receives the runner's private artifact runtime token.
      # A Python/Node child process does not, which caused failed uploads.
      - name: Upload first confirmed viral clip for Bengali dubbing
        id: bengali_upload_1
        if: ${{ always() && inputs.network == 'persian' && hashFiles('bengali_stage/clip_01/manifest.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: bengali-clip-${{ github.run_id }}-1
          path: bengali_stage/clip_01/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Start Bengali dubbing of first clip
        if: ${{ always() && steps.bengali_upload_1.outcome == 'success' }}
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            await github.rest.repos.createDispatchEvent({
              owner, repo,
              event_type: 'didban_bengali_clip_ready',
              client_payload: {run_id: Number(context.runId), clip_index: 1},
            });
            core.info('Bengali dubbing dispatched for confirmed viral clip 1');

      - name: Upload second confirmed viral clip for Bengali dubbing
        id: bengali_upload_2
        if: ${{ always() && inputs.network == 'persian' && hashFiles('bengali_stage/clip_02/manifest.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: bengali-clip-${{ github.run_id }}-2
          path: bengali_stage/clip_02/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Start Bengali dubbing of second clip
        if: ${{ always() && steps.bengali_upload_2.outcome == 'success' }}
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            await github.rest.repos.createDispatchEvent({
              owner, repo,
              event_type: 'didban_bengali_clip_ready',
              client_payload: {run_id: Number(context.runId), clip_index: 2},
            });
            core.info('Bengali dubbing dispatched for confirmed viral clip 2');

      - name: Upload transcript and diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: velayat-${{ inputs.network }}-${{ github.run_id }}
          path: |
            program_transcript.txt
            program_transcript_timed.txt
            program_report.json
          if-no-files-found: ignore
          retention-days: 3
