name: Velayat Live Monitor

on:
  schedule:
    # Runner starts 10 minutes before each official slot.
    # Python waits until the exact start time before recording.
    - cron: "50 17 * * 0-4,6"
      timezone: "Asia/Tehran"
    - cron: "20 19 * * 0-4,6"
      timezone: "Asia/Tehran"
    - cron: "50 20 * * 0-4,6"
      timezone: "Asia/Tehran"

  workflow_dispatch:
    inputs:
      slot:
        description: "Program slot for manual run"
        required: true
        type: choice
        options:
          - "18:00"
          - "19:30"
          - "21:00"

permissions:
  contents: read

concurrency:
  group: velayat-live-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 85

    steps:
      - name: Resolve fixed program slot
        id: slot
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_SLOT: ${{ inputs.slot }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            SLOT="$MANUAL_SLOT"
          else
            case "$SCHEDULE_CRON" in
              "50 17 * * 0-4,6")
                SLOT="18:00"
                ;;
              "20 19 * * 0-4,6")
                SLOT="19:30"
                ;;
              "50 20 * * 0-4,6")
                SLOT="21:00"
                ;;
              *)
                echo "Unknown schedule: $SCHEDULE_CRON"
                exit 1
                ;;
            esac
          fi

          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
          echo "Resolved PROGRAM_SLOT=$SLOT"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Monitor live program
        env:
          STREAM_URL: ${{ secrets.STREAM_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SHEETS_WEBHOOK_URL: ${{ secrets.SHEETS_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          PROGRAM_SLOT: ${{ steps.slot.outputs.slot }}
        run: python velayat_monitor.py

      - name: Upload transcript and diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: velayat-monitor-${{ github.run_id }}
          path: |
            program_transcript.txt
            program_report.json
          if-no-files-found: ignore
          retention-days: 3
