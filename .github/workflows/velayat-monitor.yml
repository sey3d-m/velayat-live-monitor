name: Velayat Live Monitor

on:
  workflow_dispatch:
    inputs:
      network:
        description: "Network"
        required: true
        type: choice
        options:
          - persian
          - azeri
          - arabic
          - hausa
      slot:
        description: "Program slot (Tehran time)"
        required: true
        type: choice
        options:
          - "16:30"
          - "18:00"
          - "19:30"
          - "21:00"
          - "22:30"
      scheduled_date:
        description: "Scheduled Tehran date YYYY-MM-DD (normally filled by Apps Script)"
        required: false
        type: string

permissions:
  contents: read

# Same-time programs on different networks run independently. Accidental duplicate
# dispatches for the same network/slot/date are serialized, never allowed to cancel
# the active recording.
concurrency:
  group: velayat-live-monitor-${{ inputs.network }}-${{ inputs.slot }}-${{ inputs.scheduled_date }}
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Validate network and slot
        shell: bash
        env:
          NETWORK: ${{ inputs.network }}
          SLOT: ${{ inputs.slot }}
        run: |
          set -euo pipefail
          case "${NETWORK}:${SLOT}" in
            persian:18:00|persian:19:30|persian:21:00|azeri:16:30|azeri:18:00|arabic:21:00|hausa:22:30)
              echo "Valid schedule: ${NETWORK} ${SLOT}"
              ;;
            *)
              echo "Invalid network/slot pair: ${NETWORK} ${SLOT}" >&2
              exit 1
              ;;
          esac

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Ensure FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Cache faster-whisper model downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: faster-whisper-${{ runner.os }}-models-v2
          restore-keys: |
            faster-whisper-${{ runner.os }}-models-
            faster-whisper-${{ runner.os }}-

      - name: Install Python packages
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Monitor live program
        env:
          NETWORK: ${{ inputs.network }}
          PROGRAM_SLOT: ${{ inputs.slot }}
          SCHEDULED_DATE: ${{ inputs.scheduled_date }}

          # Existing Persian stream secret; no change required.
          STREAM_URL: ${{ secrets.STREAM_URL }}

          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SHEETS_WEBHOOK_URL: ${{ secrets.SHEETS_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}

          # Persian reports remain in the existing Bale channel.
          # Azeri / Arabic / Hausa reports go to the new non-Persian channel.
          BALE_CHAT_ID: ${{ inputs.network == 'persian' && secrets.BALE_CHAT_ID || secrets.BALE_CHAT_ID_NONPERSIAN }}

          GITHUB_RUN_ID: ${{ github.run_id }}

          # Optional repository variables. Built-in defaults are used when empty.
          AZERI_STREAM_URL: ${{ vars.AZERI_STREAM_URL }}
          ARABIC_STREAM_URL: ${{ vars.ARABIC_STREAM_URL }}
          HAUSA_STREAM_URL: ${{ vars.HAUSA_STREAM_URL }}
          WHISPER_MODEL: ${{ vars.WHISPER_MODEL }}
        run: python velayat_monitor.py

      - name: Upload transcript and diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: velayat-${{ inputs.network }}-${{ inputs.slot }}-${{ github.run_id }}
          path: |
            program_transcript.txt
            program_transcript_timed.txt
            program_report.json
          if-no-files-found: ignore
          retention-days: 3
