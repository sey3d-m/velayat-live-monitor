name: Didban Bengali Auto Dubbing

on:
  repository_dispatch:
    types: [didban_bengali_clip_ready]

permissions:
  contents: read
  actions: read

concurrency:
  group: didban-bengali-${{ github.event.client_payload.run_id }}-${{ github.event.client_payload.clip_index }}
  cancel-in-progress: false

jobs:
  dub-single-clip:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    env:
      ORIGIN_RUN_ID: ${{ github.event.client_payload.run_id }}
      CLIP_INDEX: ${{ github.event.client_payload.clip_index }}
      BN_EXPECT_COUNT: '1'
      BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '3'
    steps:
      - uses: actions/checkout@v4

      - name: Validate origin run and its individual clip artifact
        uses: actions/github-script@v7
        with:
          script: |
            const id = Number(process.env.ORIGIN_RUN_ID);
            const idx = Number(process.env.CLIP_INDEX);
            if (!Number.isSafeInteger(id) || id < 1 || ![1, 2].includes(idx)) {
              core.setFailed('Invalid source run or clip index');
              return;
            }
            const {owner, repo} = context.repo;
            const run = await github.rest.actions.getWorkflowRun({owner, repo, run_id: id});
            if (run.data.name !== 'Velayat Live Monitor' ||
                run.data.head_branch !== 'main' ||
                run.data.event !== 'workflow_dispatch' ||
                !['queued', 'in_progress', 'completed'].includes(run.data.status) ||
                run.data.conclusion === 'cancelled') {
              core.setFailed('Untrusted origin run');
              return;
            }
            const target = 'bengali-clip-' + id + '-' + idx;
            let found = false;
            for (let attempt = 0; attempt < 8; attempt++) {
              const artifacts = await github.paginate(
                github.rest.actions.listWorkflowRunArtifacts,
                {owner, repo, run_id: id, per_page: 100}
              );
              found = artifacts.some(a => a.name === target && !a.expired);
              if (found) break;
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            if (!found) core.setFailed('Source clip artifact missing');

      - name: Download single confirmed Persian clip
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: ${{ env.ORIGIN_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: bengali-clip-${{ env.ORIGIN_RUN_ID }}-${{ env.CLIP_INDEX }}
          path: bengali_dub_input/

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache local free-license speech models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: didban-bengali-models-fa-bn-male-v1

      - name: Install CPU speech dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libsndfile1 espeak-ng libespeak-ng1
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchaudio
          python -m pip install -r requirements-bengali.txt

      - name: Dub and publish this clip to @double_vtv
        run: python bengali_dubbing.py

      - name: Upload delivery status only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bengali-result-${{ env.ORIGIN_RUN_ID }}-${{ env.CLIP_INDEX }}
          path: bengali_dub_output/delivery.json
          if-no-files-found: ignore
          retention-days: 3
