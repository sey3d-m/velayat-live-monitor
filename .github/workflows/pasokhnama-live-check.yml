name: Validate and publish independent Pasokhnama OBS page
on:
  push:
    branches: [main]
    paths:
      - 'pasokhnama_live_capture.py'
      - 'pasokhnama_live_editor.py'
      - 'pasokhnama_live_audio.py'
      - 'tests/test_pasokhnama_live_editor.py'
      - '.github/workflows/pasokhnama-live.yml'
      - '.github/workflows/pasokhnama-live-check.yml'
      - 'docs/overlay-live.html'
      - 'docs/assets/pasokhnama-live.js'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publish-qa-dashboard
  cancel-in-progress: false

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline syntax and boundary verification
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile pasokhnama_live_capture.py pasokhnama_live_editor.py pasokhnama_live_audio.py
          python -m unittest discover -s tests -p 'test_pasokhnama_live_editor.py' -v
          node --check docs/assets/pasokhnama-live.js
          test -s docs/overlay-live.html
          test -s .github/workflows/pasokhnama-live.yml
          test -f state/live.json && exit 1 || true
          echo 'Isolated live page and Python worker syntax OK.'
      - uses: actions/configure-pages@v5
      - name: Stage same-origin public snapshot for restricted OBS browsers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, urllib.request
          uri='https://raw.githubusercontent.com/sey3d-m/velayat-live-monitor/pasokhnama-live-data/state/live.json'
          with urllib.request.urlopen(urllib.request.Request(
              uri,headers={'User-Agent':'pasokhnama-public-pages-snapshot'}),timeout=30) as response:
              state=json.load(response)
          assert state.get('network')=='velayat_farsi'
          assert isinstance(state.get('items'),list)
          target=pathlib.Path('docs/data/pasokhnama-snapshot.json')
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_text(json.dumps(state,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          # Embed the latest public, previously accepted topics directly in
          # this build's OBS HTML. Cards appear immediately even with JS OFF or
          # all external GitHub data endpoints unreachable. Explicitly non-live.
          from html import escape
          accepted=[
            item for item in state['items']
            if isinstance(item,dict) and item.get('kind')=='edited_transcript'
            and item.get('scope')=='topic_only'
            and item.get('verification_status')=='machine_edited_unverified'
            and len(str(item.get('title') or ''))>=12
            and len(str(item.get('summary') or ''))>=35
          ][-3:]
          if accepted:
              page=pathlib.Path('docs/overlay-live.html')
              html=page.read_text(encoding='utf8')
              placeholder='<div class="tv-cards" id="live-content">هنوز محتوایی دریافت نشده است.</div>'
              cards=''.join(
                '<article class="tv-card"><h2>'+escape(str(x['title'])[:90])+
                '</h2><p>'+escape(str(x['summary'])[:390])+'</p></article>'
                for x in reversed(accepted)
              )
              assert placeholder in html, 'Source OBS placeholder missing'
              html=html.replace(placeholder,'<div class="tv-cards" id="live-content">'+cards+'</div>')
              html=html.replace('<span id="live-status">در انتظار</span>',
                                '<span id="live-status">آخرین مطالب ذخیره‌شده (غیرزنده)</span>')
              html=html.replace('<div class="tv-program-info" id="live-program">در انتظار برنامه</div>',
                                '<div class="tv-program-info" id="live-program">'+
                                escape(str(state.get('program') or 'شبکه ولایت فارسی')[:95])+'</div>')
              page.write_text(html,encoding='utf8')
          print('OBS static initial headlines=',len(accepted))
          print('Same-origin OBS fallback staged, items=',len(state['items']),
                'source_updated=',state.get('updated_at'))
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify actual public OBS page and readable live JSON
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, time, urllib.request
          urls = {
            'overlay': 'https://sey3d-m.github.io/velayat-live-monitor/overlay-live.html',
            'script': 'https://sey3d-m.github.io/velayat-live-monitor/assets/pasokhnama-live.js',
            'feed': 'https://raw.githubusercontent.com/sey3d-m/velayat-live-monitor/pasokhnama-live-data/state/live.json',
          }
          results = {}
          for name, url in urls.items():
              for attempt in range(6):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(
                          url + '?test=' + str(int(time.time())),
                          headers={'User-Agent':'pasokhnama-public-healthcheck'}
                      ), timeout=18) as response:
                          body = response.read(100000)
                          cors = response.headers.get('Access-Control-Allow-Origin', '')
                          results[name] = (body, cors)
                          break
                  except Exception as exc:
                      if attempt == 5: raise
                      time.sleep(4)
          html = results['overlay'][0].decode('utf8')
          script = results['script'][0].decode('utf8')
          feed = json.loads(results['feed'][0])
          assert 'live-content' in html and 'assets/pasokhnama-live.js' in html
          assert 'state/live.json' in script
          assert feed['network'] == 'velayat_farsi' and isinstance(feed['items'], list)
          assert results['feed'][1] in ('*', 'https://sey3d-m.github.io'), 'Browser CORS missing for JSON feed'
          print('Public page and JS accessible; live feed CORS OK; status=',feed['status'],
                'items=',len(feed['items']))
          PY
