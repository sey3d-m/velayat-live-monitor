name: Validate and publish independent Pasokhnama OBS page
on:
  push:
    branches: [main]
    paths:
      - 'pasokhnama_live_capture.py'
      - '.github/workflows/pasokhnama-live.yml'
      - '.github/workflows/pasokhnama-live-check.yml'
      - 'docs/overlay-live.html'
      - 'docs/assets/pasokhnama-live.js'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publish-qa-dashboard
  cancel-in-progress: false

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline syntax and boundary verification
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile pasokhnama_live_capture.py
          node --check docs/assets/pasokhnama-live.js
          test -s docs/overlay-live.html
          test -s .github/workflows/pasokhnama-live.yml
          test -f state/live.json && exit 1 || true
          echo 'Isolated live page and Python worker syntax OK.'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
        id: deployment
