name: Didban Editor - Free Worker Tests
on:
  pull_request:
    paths:
      - 'editor_worker/**'
      - '.github/workflows/didban-editor-worker-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test editor_worker/tests/*.test.mjs
