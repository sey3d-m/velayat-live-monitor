name: Test Full Velayat Pipeline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  end-to-end-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run 5-minute end-to-end test
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          STREAM_URL: ${{ secrets.STREAM_URL }}
          SHEETS_WEBHOOK_URL: ${{ secrets.SHEETS_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          TEST_SECONDS: "300"
        run: python e2e_test.py

      - name: Upload text results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: velayat-e2e-test-output
          path: |
            e2e_transcript.txt
            e2e_report.json
          if-no-files-found: ignore
          retention-days: 3
