name: Test Google Sheets Webhook

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webhook-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Send sample report to Google Sheet
        env:
          SHEETS_WEBHOOK_URL: ${{ secrets.SHEETS_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error
          from datetime import datetime, timezone

          url = os.environ["SHEETS_WEBHOOK_URL"].strip()
          secret = os.environ["WEBHOOK_SECRET"].strip()
          run_id = os.environ.get("GITHUB_RUN_ID", "manual")

          if not url:
              raise SystemExit("SHEETS_WEBHOOK_URL is empty")

          if not secret:
              raise SystemExit("WEBHOOK_SECRET is empty")

          payload = {
              "secret": secret,
              "report_id": f"GITHUB_TEST_{run_id}",
              "date": "1405/06/16",
              "day": "شنبه",
              "start": "18:00",
              "end": "19:00",
              "program": "آزمایش اتصال GitHub",
              "expert": "کارشناس آزمایشی",
              "topic": "تست ارتباط GitHub Actions با Google Sheets",
              "summary": "این گزارش به صورت خودکار از GitHub Actions برای آزمایش اتصال سامانه به Google Apps Script ارسال شده است.",
              "key_points": [
                  "ارسال موفق داده از GitHub Actions",
                  "دریافت Webhook توسط Google Apps Script",
                  "ثبت خودکار گزارش در شیت REPORTS"
              ],
              "questions": [
                  "آیا گزارش با موفقیت در Google Sheet ثبت شد؟"
              ],
              "status": "TEST"
          }

          body = json.dumps(
              payload,
              ensure_ascii=False
          ).encode("utf-8")

          request = urllib.request.Request(
              url,
              data=body,
              headers={
                  "Content-Type": "application/json; charset=utf-8"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:
                  response_text = response.read().decode("utf-8")

          except urllib.error.HTTPError as e:
              error_body = e.read().decode("utf-8", errors="replace")
              print("HTTP ERROR:", e.code)
              print(error_body)
              raise

          except Exception as e:
              print("REQUEST ERROR:", repr(e))
              raise

          print("Webhook response:")
          print(response_text)

          try:
              result = json.loads(response_text)
          except json.JSONDecodeError:
              raise SystemExit(
                  "Webhook did not return valid JSON."
              )

          if result.get("ok") is not True:
              raise SystemExit(
                  "Webhook returned an error: " +
                  json.dumps(
                      result,
                      ensure_ascii=False
                  )
              )

          print("SUCCESS")
          print("Report ID:", result.get("report_id"))
          print("Sheet row:", result.get("row"))
          PY
