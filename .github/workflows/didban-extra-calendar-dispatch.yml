name: Didban Extra Program Calendar - Dispatch

on:
  # Kick off a diagnostic bot poll as soon as this workflow is updated.
  # Routine calendar-state commits do not match this path, so no push loop.
  push:
    branches: [main]
    paths:
      - '.github/workflows/didban-extra-calendar-dispatch.yml'
      - 'didban_calendar_bot.py'
      - 'didban_bot_keyboards.py'
  schedule:
    # Avoid UTC minute zero, where GitHub cron load can cause missed runs.
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: didban-extra-calendar-write
  cancel-in-progress: false

jobs:
  check-and-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install calendar and Bale API dependencies
        run: python -m pip install 'jdatetime>=5,<6' 'requests>=2.31,<3'
      - name: Check private Bale bot configuration (safe diagnostics)
        shell: bash
        env:
          DIDBAN_CONTROL_BOT_TOKEN: ${{ secrets.DIDBAN_CONTROL_BOT_TOKEN }}
          DIDBAN_CONTROL_ADMIN_IDS: ${{ secrets.DIDBAN_CONTROL_ADMIN_IDS }}
        run: |
          if [[ -n "${DIDBAN_CONTROL_BOT_TOKEN}" ]]; then
            echo "Calendar control bot token: configured"
          else
            echo "::warning::Calendar control bot token missing: DIDBAN_CONTROL_BOT_TOKEN"
          fi
          if [[ -n "${DIDBAN_CONTROL_ADMIN_IDS}" ]]; then
            echo "Calendar admin allowlist: configured"
          else
            echo "::notice::Admin allowlist not configured; 'شناسه من' still works in private chat."
          fi

      - name: Read private Bale calendar commands (optional dedicated bot)
        id: bale_control
        continue-on-error: true
        env:
          DIDBAN_CONTROL_BOT_TOKEN: ${{ secrets.DIDBAN_CONTROL_BOT_TOKEN }}
          DIDBAN_CONTROL_ADMIN_IDS: ${{ secrets.DIDBAN_CONTROL_ADMIN_IDS }}
        run: python didban_calendar_bot.py poll

      - name: Report private Bale bot failure without stopping program dispatch
        if: ${{ steps.bale_control.outcome == 'failure' }}
        shell: bash
        run: echo "::error::Calendar bot polling failed. Check the previous step for a credential, webhook, API or Python error. Program dispatch remains independent."

      - name: Discard partial bot changes if polling fails
        if: ${{ steps.bale_control.outcome == 'failure' }}
        shell: bash
        run: |
          git restore -- config/didban_extra_programs.json docs/data/extra-programs.json config/didban_calendar_bot_state.json

      - name: Persist approved bot changes before responding
        if: ${{ steps.bale_control.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/didban_extra_programs.json docs/data/extra-programs.json config/didban_calendar_bot_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Apply confirmed private Didban calendar bot commands"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Reply to private calendar bot commands
        if: ${{ steps.bale_control.outcome == 'success' }}
        continue-on-error: true
        env:
          DIDBAN_CONTROL_BOT_TOKEN: ${{ secrets.DIDBAN_CONTROL_BOT_TOKEN }}
        run: python didban_calendar_bot.py reply

      - name: Refresh private admin button menu on code deployment
        # Deploy-triggered menu push is independent of message polling intervals.
        if: ${{ github.event_name == 'push' }}
        continue-on-error: true
        env:
          DIDBAN_CONTROL_BOT_TOKEN: ${{ secrets.DIDBAN_CONTROL_BOT_TOKEN }}
          DIDBAN_CONTROL_ADMIN_IDS: ${{ secrets.DIDBAN_CONTROL_ADMIN_IDS }}
        run: python didban_calendar_bot.py welcome

      - name: Find scheduled additional broadcast slots in Tehran time
        run: python extra_schedule.py due > /tmp/didban-extra-due.json
      - name: Dispatch only missing occurrences to the original monitor
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const due = JSON.parse(fs.readFileSync('/tmp/didban-extra-due.json', 'utf8'));
            const {owner, repo} = context.repo;
            if (!due.length) { core.info('No extra Persian programs due'); return; }

            const listed = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              {owner, repo, workflow_id: 'velayat-monitor.yml',
               event: 'workflow_dispatch', per_page: 100},
              response => response.data.workflow_runs
            );
            for (const item of due) {
              // The run-name identity is stable for one program on one Tehran day.
              const already = listed.some(run => (run.display_title || '').includes(item.identity));
              if (already) {
                core.info('Already dispatched: ' + item.identity);
                continue;
              }
              await github.rest.actions.createWorkflowDispatch({
                owner, repo, workflow_id: 'velayat-monitor.yml',
                ref: 'main',
                inputs: {
                  network: 'persian', slot: item.slot,
                  scheduled_date: item.scheduled_date,
                  extra_program_id: item.id,
                },
              });
              core.info('Dispatched verified additional slot: ' + item.identity + ' ' + item.title);
            }
