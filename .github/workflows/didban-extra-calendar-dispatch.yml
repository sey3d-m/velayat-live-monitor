name: Didban Extra Program Calendar - Dispatch

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: didban-extra-programs-dispatch
  cancel-in-progress: false

jobs:
  check-and-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Iranian-calendar support
        run: python -m pip install 'jdatetime>=5,<6'
      - name: Find scheduled additional broadcast slots in Tehran time
        run: python extra_schedule.py due > /tmp/didban-extra-due.json
      - name: Dispatch only missing occurrences to the original monitor
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const due = JSON.parse(fs.readFileSync('/tmp/didban-extra-due.json', 'utf8'));
            const {owner, repo} = context.repo;
            if (!due.length) { core.info('No extra Persian programs due'); return; }

            const listed = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              {owner, repo, workflow_id: 'velayat-monitor.yml',
               event: 'workflow_dispatch', per_page: 100},
              response => response.data.workflow_runs
            );
            for (const item of due) {
              // The run-name identity is stable for one program on one Tehran day.
              const already = listed.some(run => (run.display_title || '').includes(item.identity));
              if (already) {
                core.info('Already dispatched: ' + item.identity);
                continue;
              }
              await github.rest.actions.createWorkflowDispatch({
                owner, repo, workflow_id: 'velayat-monitor.yml',
                ref: 'main',
                inputs: {
                  network: 'persian', slot: item.slot,
                  scheduled_date: item.scheduled_date,
                  extra_program_id: item.id,
                },
              });
              core.info('Dispatched verified additional slot: ' + item.identity + ' ' + item.title);
            }
