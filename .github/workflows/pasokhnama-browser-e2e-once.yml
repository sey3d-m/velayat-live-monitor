# A one-shot browser-level verification of the ACTUAL OBS page, not only an HTTP 200.
# This workflow never modifies Didban, other sites, or server state.
name: Test actual Pasokhnama OBS card rendering in Chrome
on:
  push:
    branches: [main]
    paths: ['.github/workflows/pasokhnama-browser-e2e-once.yml']
permissions:
  contents: read
jobs:
  browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install Chrome automation client
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/pasokhnama-browser" --no-audit --no-fund playwright-core@1.56.1 >/dev/null
          command -v google-chrome
      - name: Assert actual page renders real Persian cards
        shell: bash
        env:
          BROWSER_MODULE: ${{ runner.temp }}/pasokhnama-browser/node_modules/playwright-core
        run: |
          node <<'JS'
          const { chromium } = require(process.env.BROWSER_MODULE);
          (async () => {
            const browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',
              headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            let hasFailure=false;
            try {
              for(const blocked of [0,1,2]) {
                const page=await browser.newPage({viewport:{width:1280,height:720}});
                const errors=[];
                page.on('pageerror',err=>errors.push(err.message));
                if(blocked >= 1) {
                  await page.route('https://raw.githubusercontent.com/**', route=>route.abort());
                }
                if(blocked >= 2) {
                  await page.route('https://api.github.com/**', route=>route.abort());
                  await page.route('https://cdn.jsdelivr.net/**', route=>route.abort());
                }
                const res=await page.goto(
                  'https://sey3d-m.github.io/velayat-live-monitor/overlay-live.html?browser_test='+Date.now()+'&block='+blocked,
                  {waitUntil:'domcontentloaded',timeout:45000});
                await page.waitForTimeout(blocked===0?8000:16000);
                const state=await page.evaluate(()=>{
                  const cards=[...document.querySelectorAll('#live-content article.tv-card')];
                  return {
                    title:document.title,
                    status:document.querySelector('#live-status')?.textContent,
                    headings:cards.map(card=>card.querySelector('h2')?.textContent),
                    visibleCards:cards.filter(card=>{
                      const r=card.getBoundingClientRect();
                      const st=getComputedStyle(card);
                      return r.width>0&&r.height>0&&st.visibility!=='hidden'&&st.display!=='none'
                    }).length,
                    empty:document.querySelector('#live-content .tv-empty')?.textContent,
                    source:document.querySelector('#live-updated')?.textContent
                  };
                });
                console.log('OBS_BROWSER_TEST: blocked_level='+blocked+' HTTP='+res.status()+
                  ' state='+JSON.stringify(state)+' script_errors='+JSON.stringify(errors));
                if(!res.ok()||state.visibleCards<1||errors.length) hasFailure=true;
                await page.close();
              }
              // Same-origin HTML must show previously accepted headings
              // immediately even in OBS browsers with JavaScript disabled.
              const offline=await browser.newPage({javaScriptEnabled:false,viewport:{width:1280,height:720}});
              const offlineResponse=await offline.goto(
                'https://sey3d-m.github.io/velayat-live-monitor/overlay-live.html?js_off='+Date.now(),
                {waitUntil:'domcontentloaded',timeout:30000});
              const offlineHeads=await offline.locator('#live-content article.tv-card h2').allTextContents();
              console.log('OBS_BROWSER_TEST: javascript_disabled HTTP='+offlineResponse.status()+
                ' headings='+JSON.stringify(offlineHeads));
              if(!offlineResponse.ok()||offlineHeads.length<1) hasFailure=true;
              await offline.close();
              if(hasFailure) process.exitCode=1;
            } finally {await browser.close()}
          })().catch(err=>{console.error('OBS_BROWSER_TEST: fatal='+err.message);process.exitCode=1});
          JS
