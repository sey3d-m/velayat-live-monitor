<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>تنظیمات پاسخ‌نما ۴</title><link rel="stylesheet" href="assets/styles.css"></head><body class="settings-page" data-page="settings"><header class="main-header"><div class="container header-row"><a class="brand" href="./"><span class="brand-mark">و</span><span><b>پاسخ‌نما</b><small>تنظیمات نسخه ۴</small></span></a><a class="outline-button" href="./">بازگشت به سامانه ←</a></div></header><main class="container settings-shell"><div class="settings-head"><span class="kicker">پیکربندی</span><h1>تنظیمات نمایش و تلویزیون</h1><p>«ذخیره محلی» فقط روی همین مرورگر اعمال می‌شود. برای اعمال تنظیمات در GitHub Pages و OBS، خروجی JSON را در مخزن به‌جای <code>docs/data/config.json</code> قرار دهید. این صفحه پنل مدیریتی احرازهویت‌شده نیست.</p></div><form id="settings-form" class="settings-form"><label>تازه‌سازی صفحه (ثانیه، ۶۰ تا ۱۲۰)<input id="s-refresh" type="number" min="60" max="120"></label><label>تعداد کارت تلویزیون (۴ تا ۶)<input id="s-count" type="number" min="4" max="6"></label><label>حداکثر حروف خلاصه کارت<input id="s-length" type="number" min="70" max="300"></label><label>موقعیت تلویزیون<select id="s-position"><option value="right">راست</option><option value="left">چپ</option><option value="bottom">پایین</option></select></label><label>رنگ اصلی پنل<input id="s-color" type="color"></label><label>اندازه قلم تلویزیون<input id="s-font" type="number" min="14" max="36"></label><label>مدت تازه‌بودن گزارش (دقیقه)<input id="s-stale" type="number" min="10" max="240"></label><label>عرض پنل (پیکسل)<input id="s-width" type="number" min="350" max="900"></label><label>پرسش و پاسخ نسبت به دیگر محتوا<textarea id="s-priority" rows="2" placeholder="مثال: 1.2"></textarea></label><label>لوگوی اختیاری (مسیر نسبی یا HTTPS)<input id="s-logo" type="text" placeholder="assets/logo.png"></label><div class="settings-toggles"><label><input type="checkbox" id="s-timecodes"> نمایش تایم‌کد</label><label><input type="checkbox" id="s-audience"> نمایش نام/شهر مخاطب</label><label><input type="checkbox" id="s-qa"> نمایش پرسش و پاسخ</label><label><input type="checkbox" id="s-topics"> نمایش مطالب علمی</label></div><div class="settings-actions"><button type="button" id="save-settings" class="solid-button">ذخیره محلی</button><button type="button" id="export-settings" class="outline-button">دریافت فایل تنظیمات JSON</button><a href="overlay.html?demo=1" target="_blank" class="outline-button">پیش‌نمایش نمونه</a></div></form><div id="settings-feedback" class="settings-feedback" role="status"></div></main><script src="assets/app.js" defer></script></body></html>
